name: Статистика

# Трафик репозитория GitHub хранит только 14 дней и старше не отдаёт никому.
# Этот запуск раз в сутки забирает цифры до того, как они пропадут, и кладёт
# их в stats/ рядом с кодом.

on:
  schedule:
    # 03:17 UTC - неровное время специально: ровные часы у GitHub загружены,
    # и запуск по расписанию сдвигается сильнее.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: stats-data
          path: stats-data
          persist-credentials: false

      - name: Собрать статистику
        env:
          # У встроенного токена нет доступа к traffic. Для него нужен
          # STATS_TOKEN с Administration (read) только на этот репозиторий.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          STATS_DIR: ${{ github.workspace }}/stats-data/stats
        run: python3 scripts/collect-stats.py

      - name: Сохранить в stats-data
        working-directory: stats-data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- stats/*.csv
          if git diff --staged --quiet; then
            echo "Изменений нет - коммит не нужен."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Статистика за $(date -u +%F) [skip ci]"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/stats-data
