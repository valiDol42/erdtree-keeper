name: Релиз

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия, например v1.0.0'
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Версия из тега
        id: version
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') {
            $env:GITHUB_REF -replace 'refs/tags/', ''
          } else {
            '${{ inputs.version }}'
          }
          $number = $tag.TrimStart('v')
          "tag=$tag"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "number=$number" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Тесты
        run: dotnet test --configuration Release

      - name: Сборка
        run: >
          dotnet publish src/ErdtreeKeeper/ErdtreeKeeper.csproj
          --configuration Release --runtime win-x64 --output out
          -p:Version=${{ steps.version.outputs.number }}
          -p:InformationalVersion=${{ steps.version.outputs.number }}

      - name: Проверить, что exe не консольный
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes("out/ErdtreeKeeper.exe")
          $peOffset = [BitConverter]::ToUInt32($bytes, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 0x5c)
          if ($subsystem -ne 2) { throw "Ожидалась подсистема GUI (2), получено $subsystem" }

      - name: Собрать архив
        shell: pwsh
        run: |
          $name = "ErdtreeKeeper-${{ steps.version.outputs.tag }}-win-x64"
          New-Item -ItemType Directory -Path dist/$name | Out-Null
          # В поставку идут только exe и нативные библиотеки отрисовки.
          Copy-Item out/*.exe, out/*.dll dist/$name
          Copy-Item README.md, SECURITY.md, LICENSE dist/$name
          Compress-Archive -Path dist/$name -DestinationPath dist/$name.zip
          Get-ChildItem dist/$name | Select-Object Name, Length

      - name: Контрольные суммы
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist/*.zip, out/ErdtreeKeeper.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Tee-Object -FilePath dist/SHA256SUMS.txt

      # Подтверждает, что файл собран из этого репозитория этим рабочим процессом.
      # Проверка у пользователя: gh attestation verify <файл> --repo <owner>/<repo>
      #
      # GitHub выдаёт attestation только публичным репозиториям личных аккаунтов
      # ("Feature not available for user-owned private repositories"). Пока
      # репозиторий приватный, шаг пропускается - иначе он валит весь релиз, и
      # пользователь не получает даже архива с контрольными суммами.
      - name: Attestation происхождения сборки
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.zip
            out/ErdtreeKeeper.exe

      # В начало текста выпуска - раздел этой версии из CHANGELOG.md. Именно
      # его программа показывает в окне обновления под «Что изменилось»; всё,
      # что ниже границы, она отрезает. Раньше там стояла одна инструкция по
      # проверке файла, и человек читал про SmartScreen вместо новостей.
      - name: Заметки выпуска
        shell: pwsh
        run: |
          $number = '${{ steps.version.outputs.number }}'
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = [Array]::IndexOf($lines, "## $number")
          $changes = @()
          if ($start -ge 0) {
            for ($i = $start + 1; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^## ' -or $lines[$i] -eq '---') { break }
              $changes += $lines[$i]
            }
          } else {
            Write-Host "::warning::В CHANGELOG.md нет раздела ## $number - в выпуске будет только инструкция"
          }

          $marker = '<!-- keeper:end-of-changes -->'
          $details = Get-Content .github/release-details.md -Encoding utf8 -Raw
          $details = $details.Replace('{repository}', '${{ github.repository }}')

          $body = (($changes -join "`n").Trim()) + "`n`n" + $marker + "`n`n" + $details
          Set-Content dist/NOTES.md $body -Encoding utf8
          Get-Content dist/NOTES.md -TotalCount 30

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Erdtree Keeper ${{ steps.version.outputs.tag }}
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          body_path: dist/NOTES.md
