name: Сборка и тесты

on:
  push:
    branches: [main]
    # Ежедневный коммит статистики кода не меняет - гонять из-за него сборку
    # и тесты на windows-latest незачем.
    paths-ignore:
      - 'stats/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Тесты
        # Тесты, которым нужны настоящие сейвы, пропускаются сами:
        # переменная ERDTREE_KEEPER_FIXTURES здесь не задана.
        run: dotnet test --configuration Release

      - name: Сборка релизного exe
        run: >
          dotnet publish src/ErdtreeKeeper/ErdtreeKeeper.csproj
          --configuration Release --runtime win-x64 --output out

      - name: Проверить, что exe не консольный
        # Подсистема должна быть GUI (2). Если станет 3, у пользователя за окном
        # появится чёрная консоль - ровно то, от чего ушли.
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes("out/ErdtreeKeeper.exe")
          $peOffset = [BitConverter]::ToUInt32($bytes, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 0x5c)
          Write-Host "PE subsystem: $subsystem"
          if ($subsystem -ne 2) { throw "Ожидалась подсистема GUI (2), получено $subsystem" }

      - name: Проверить адреса внутри exe
        # С появлением обновлений программа умеет открывать соединения, и
        # сторожить теперь надо не сам факт, а куда они идут. В сборке должен
        # быть ровно один адрес - тот, что заявлен в README. Появился другой
        # или пропал этот - сборка падает.
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes("out/ErdtreeKeeper.exe")
          $text = [Text.Encoding]::Unicode.GetString($bytes) + [Text.Encoding]::ASCII.GetString($bytes)

          $expected = 'https://api.github.com/repos/valiDol42/erdtree-keeper/releases/latest'
          if ($text -notmatch [regex]::Escape($expected)) {
            throw "В exe нет заявленного адреса проверки обновлений"
          }

          # Устаревшие способы ходить в сеть: ими программа не пользуется, и
          # появление любого из них означает чью-то лишнюю зависимость.
          $forbidden = @('wininet.dll', 'urlmon.dll', 'wsock32.dll')
          $found = $forbidden | Where-Object { $text -match [regex]::Escape($_) }
          if ($found) { throw "В exe попали лишние сетевые библиотеки: $($found -join ', ')" }

          Write-Host "Адрес обновлений на месте, лишних библиотек нет"

      - uses: actions/upload-artifact@v4
        with:
          name: erdtree-keeper-win-x64
          path: |
            out/*.exe
            out/*.dll
